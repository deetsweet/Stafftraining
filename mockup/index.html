/* Layout: charcoal brand band, mode switcher, then a phone-width volunteer/referee flow or a full-width admin view. Linen-first, Charcoal for impact. */
:root{
  --bg:#FFFBF0; --surface:#FFFFFF; --sunk:#F5F0E2; --ink:#333333; --ink-2:#5E5B55; --ink-3:#86827A; --line:#E7E0CF;
  --charcoal:#333333; --on-charcoal:#FFFBF0; --on-charcoal-2:rgba(255,251,240,.74); --badge-ghost:rgba(255,251,240,.07);
  --blue:#3D6270; --sage:#71806D; --moss:#B1B89F;
  --btn-bg:#333333; --btn-ink:#FFFBF0;
  --ok:#5B7656; --ok-bg:#E5EADD; --warn:#9A6E1C; --warn-bg:#F6EAD0; --bad:#A24E3A; --bad-bg:#F5E0D8; --info:#3D6270; --info-bg:#DEE8EB;
  --font-head:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --font-body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-script:"Portrait Script","Brush Script MT",cursive;
  --r-card:22px; --r-field:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#242424; --surface:#2F2F2F; --sunk:#2A2A2A; --ink:#FFFBF0; --ink-2:#D3CEC3; --ink-3:#9C978E; --line:#404040;
  --charcoal:#1B1B1B; --on-charcoal:#FFFBF0; --on-charcoal-2:rgba(255,251,240,.74); --badge-ghost:rgba(255,251,240,.05);
  --blue:#9DBDC9; --sage:#B1B89F; --moss:#B1B89F; --btn-bg:#FFFBF0; --btn-ink:#333333;
  --ok:#AEC6A4; --ok-bg:#2F3A2C; --warn:#E2BC6C; --warn-bg:#3F3524; --bad:#E79D89; --bad-bg:#452C26; --info:#9DBDC9; --info-bg:#26353B;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#242424; --surface:#2F2F2F; --sunk:#2A2A2A; --ink:#FFFBF0; --ink-2:#D3CEC3; --ink-3:#9C978E; --line:#404040;
  --charcoal:#1B1B1B; --on-charcoal:#FFFBF0; --on-charcoal-2:rgba(255,251,240,.74); --badge-ghost:rgba(255,251,240,.05);
  --blue:#9DBDC9; --sage:#B1B89F; --moss:#B1B89F; --btn-bg:#FFFBF0; --btn-ink:#333333;
  --ok:#AEC6A4; --ok-bg:#2F3A2C; --warn:#E2BC6C; --warn-bg:#3F3524; --bad:#E79D89; --bad-bg:#452C26; --info:#9DBDC9; --info-bg:#26353B;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);font-weight:500;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.label{font-family:var(--font-body);font-weight:700;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.script{font-family:var(--font-script);font-size:36px;line-height:1;color:var(--moss);font-weight:400}

/* top band */
.band{background:var(--charcoal);color:var(--on-charcoal)}
.band-in{max-width:1180px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.band svg.wordmark{height:22px;width:auto;color:var(--on-charcoal)}
.band .product{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-charcoal-2);font-weight:700}

.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modes{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-family:var(--font-head);font-weight:500;font-size:15px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.proto-note{font-size:13px;color:var(--ink-3)}

/* phone column */
.phone{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:720px){
  .phone{background:var(--bg);border:1px solid var(--line);border-radius:40px;padding:18px;box-shadow:0 30px 60px -30px rgba(40,35,25,.25);min-height:760px}
}

.hero{position:relative;overflow:hidden;background:var(--charcoal);color:var(--on-charcoal);border-radius:var(--r-card);padding:26px 22px 24px;display:flex;flex-direction:column;gap:14px}
.hero .ghost{position:absolute;right:-60px;bottom:-70px;width:260px;height:260px;color:var(--badge-ghost);pointer-events:none}
.hero > *:not(.ghost){position:relative}
.hero h1{font-size:30px}
.hero p{color:var(--on-charcoal-2);font-size:15.5px}
.hero .script{color:var(--moss)}
.hero .badge-sm{width:30px;height:30px;color:var(--on-charcoal)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 22px;font-family:var(--font-head);font-weight:500;font-size:16px;cursor:pointer;background:var(--btn-bg);color:var(--btn-ink);transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.light{background:var(--on-charcoal);color:#333333}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.block{width:100%}
.btn .arr{font-family:var(--font-body)}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.back{background:none;border:0;padding:4px 0;color:var(--ink-2);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.card.sunk{background:var(--sunk)}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.quote{font-family:var(--font-head);font-size:19px;line-height:1.35}
.sig{display:flex;align-items:center;gap:16px;margin-top:16px}
.headshot{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.sig b{font-family:var(--font-head);font-weight:500;font-size:18px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage);color:#FFFBF0;display:grid;place-items:center;font-family:var(--font-head);font-weight:500;font-size:15px;flex:none}
.need li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.need{list-style:none;margin:0;padding:0}
.need li:first-child{border-top:0}

/* progress */
.prog{display:flex;align-items:center;gap:18px}
.ring{width:76px;height:76px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:rgba(255,251,240,.14)}
.ring .val{stroke:var(--moss);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{fill:var(--on-charcoal);font-family:var(--font-head);font-size:17px;font-weight:500}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.step:hover{border-color:var(--ink-3)}
.step .t{font-family:var(--font-head);font-weight:500;font-size:17px;display:block}
.step .m{font-size:13.5px;color:var(--ink-2);display:block}
.step .body{flex:1;min-width:0}
.step .chev{color:var(--ink-3);flex:none}
.ico{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.ico.done{background:var(--ok);color:var(--bg)}
.ico.todo{border:2px solid var(--line)}
.ico.next{border:2px solid var(--blue);box-shadow:inset 0 0 0 5px var(--surface);background:var(--blue)}
.ico.wait{background:var(--warn-bg);color:var(--warn)}
.step.is-next{border-color:var(--blue);box-shadow:0 0 0 3px var(--info-bg)}

/* training */
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--charcoal);color:var(--on-charcoal);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.video .ghost{position:absolute;right:-30px;top:-20px;width:200px;height:200px;color:var(--badge-ghost)}
.video .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--on-charcoal);color:#333;display:grid;place-items:center;border:0;cursor:pointer}
.video .vt{position:relative;font-family:var(--font-head);font-size:18px}
.video .vm{position:relative;font-size:12.5px;color:var(--on-charcoal-2)}
.video .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--moss);transition:width 1.6s linear}
.chapters{list-style:none;margin:0;padding:0}
.chapters li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.chapters li:first-child{border-top:0}
.chapters .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:1.5px solid var(--line);color:var(--ink-3)}
.chapters li.done .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.chapters li.cur{font-weight:700}
.chapters li.cur .n{border-color:var(--blue);color:var(--ink)}
.chapters .d{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:400}
.sample{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.sample::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}

.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;cursor:pointer;font-size:15.5px;transition:border-color .15s}
.qopt:hover{border-color:var(--ink-3)}
.qopt.right{border-color:var(--ok);background:var(--ok-bg)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:14px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--ok-bg);color:var(--ink)}
.fb.no{background:var(--bad-bg);color:var(--ink)}
.dots{display:flex;gap:6px}
.dots span{height:5px;flex:1;border-radius:3px;background:var(--line)}
.dots span.on{background:var(--blue)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-field);padding:12px 14px;font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin-top:1px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:15px;background:var(--surface)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){border-color:var(--ink);background:var(--btn-bg);color:var(--btn-ink)}
.choice label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}

.code{list-style:none;counter-reset:c;margin:0;padding:0;display:flex;flex-direction:column}
.code li{counter-increment:c;display:grid;grid-template-columns:34px 1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.code li:first-child{border-top:0}
.code li::before{content:counter(c,decimal-leading-zero);font-family:var(--font-head);color:var(--sage);font-weight:500}
.code b{font-family:var(--font-head);font-weight:500;font-size:16px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.pad{position:relative;border:1.5px dashed var(--ink-3);border-radius:16px;background:var(--surface);height:140px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:16px;cursor:crosshair}
.pad .hint{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--ink-3);pointer-events:none}
.pad .x{position:absolute;left:16px;right:16px;bottom:36px;border-top:1px solid var(--line);pointer-events:none}

.ref{display:flex;flex-direction:column;gap:10px}
.ref h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.track{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-3);flex-wrap:wrap}

.track span.on{color:var(--ok);font-weight:700}
.track i{width:18px;height:1px;background:var(--line);display:inline-block}

details.help{border:1px solid var(--line);border-radius:16px;background:var(--sunk);padding:14px 16px}
details.help summary{cursor:pointer;font-family:var(--font-head);font-weight:500;font-size:16px}

.record{list-style:none;margin:0;padding:0}

.record li:first-child{border-top:0}
.record span:last-child{color:var(--on-charcoal-2);text-align:right}

/* confetti */
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.conf{display:none}.ring .val,.video .bar{transition:none}}

/* email */
.mail{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.mail .meta{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.mail .meta b{color:var(--ink)}
.mail .top{background:var(--sunk);padding:16px;display:flex;justify-content:center}
.mail .top svg{height:16px;color:var(--ink);width:auto}
.mail .content{padding:20px 18px;display:flex;flex-direction:column;gap:12px;font-size:15px}

/* admin */
.admin{display:flex;flex-direction:column;gap:18px}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ahead h1{font-size:34px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border-radius:18px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.tile .v{font-family:var(--font-head);font-size:36px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.tile.dark{background:var(--charcoal);color:var(--on-charcoal);border-color:var(--charcoal)}
.tile.dark .k{color:var(--on-charcoal-2)}
.tile[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--blue)} .dot.none{background:var(--line)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools .field{flex:1;min-width:200px}
.tools select{width:auto}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
th{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td .who{font-family:var(--font-head);font-weight:500;font-size:16px}
td .sub{font-size:12.5px;color:var(--ink-3)}
.cell{display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.pill{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

.scrim{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:16px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer h2{font-size:28px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv li:first-child{border-top:0}
.kv .when{font-size:12.5px;color:var(--ink-3);text-align:right}
.private{border-radius:16px;padding:14px 16px;background:var(--bad-bg);font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.private .label{color:var(--bad)}
.actions{display:flex;flex-direction:column;gap:10px}


/* certificate: a printed document, so it keeps one fixed brand look in both themes */
.cert-overlay{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.72);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:16px}
.cert-tools{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.cert-tools p{color:rgba(255,251,240,.74);font-size:13px}
.cert{container-type:inline-size;width:100%;max-width:960px;aspect-ratio:297/210;background:#FFFBF0;color:#333333;position:relative;overflow:hidden;display:grid;grid-template-columns:31% 1fr;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);font-family:var(--font-body)}
.cert-side{background:#333333;color:#FFFBF0;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:6cqw 3.6cqw 3.6cqw}
.cert-side .big{position:absolute;left:-14cqw;bottom:-10cqw;width:48cqw;height:48cqw;color:rgba(113,128,109,.55)}
.cert-side .logo{position:relative;width:19cqw;height:auto;color:#FFFBF0;align-self:center}
.cert-side .meta{position:relative;font-size:1.15cqw;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,251,240,.7);line-height:1.9}
.cert-side .meta b{color:#FFFBF0;font-weight:700}
.cert-main{position:relative;padding:5.2cqw 5.4cqw 4cqw 5cqw;display:flex;flex-direction:column}
.cert-main:before{content:"";position:absolute;inset:2cqw 2cqw 2cqw 0;border:1px solid #B1B89F;border-left:0;pointer-events:none}
.cert-eyebrow{font-weight:700;font-size:1.25cqw;letter-spacing:.32em;text-transform:uppercase;color:#3D6270}
.cert-script{font-family:var(--font-script);font-size:3.6cqw;color:#71806D;line-height:1;margin-top:3.4cqw}
.cert-name{font-family:var(--font-head);font-weight:500;font-size:6.4cqw;line-height:1;margin-top:1.4cqw;letter-spacing:-.01em}
.cert-body{font-size:1.55cqw;line-height:1.55;color:#4a4a48;max-width:46cqw;margin-top:1.8cqw}
.cert-title{font-family:var(--font-head);font-style:italic;font-weight:700;text-transform:uppercase;font-size:4.6cqw;line-height:.95;margin-top:1.6cqw;letter-spacing:.005em}
.cert-sub{font-family:var(--font-head);font-weight:500;font-size:1.9cqw;color:#333333;margin-top:.8cqw}
.cert-checks{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw;margin-top:auto;padding-top:2.4cqw;border-top:1px solid #E1D9C6}
.cert-checks div{display:flex;flex-direction:column;gap:.4cqw}
.cert-checks .k{font-size:1cqw;letter-spacing:.2em;text-transform:uppercase;color:#71806D;font-weight:700;display:flex;align-items:center;gap:.6cqw}
.cert-checks .k i{width:1.5cqw;height:1.5cqw;border-radius:50%;background:#71806D;display:inline-grid;place-items:center;color:#FFFBF0;font-style:normal;font-size:1cqw}
.cert-checks .v{font-size:1.3cqw;color:#333333;line-height:1.35}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;margin-top:3cqw}
.cert-sign{min-width:22cqw}
.cert-sign .line{border-top:1px solid #333333;margin-top:4cqw;padding-top:.8cqw;font-family:var(--font-head);font-weight:500;font-size:1.5cqw}
.cert-sign .role{font-size:1.15cqw;color:#6b6862}

.cert-valid{text-align:right;font-size:1.15cqw;color:#6b6862;line-height:1.5}
.cert-valid b{font-family:var(--font-head);font-weight:500;font-size:1.6cqw;color:#333333;display:block}
/* photos + induction deck */
.hero.has-photo{padding:0;gap:0}
.hero-img{display:block;width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover}

.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column}
.slide.dark{background:var(--charcoal);color:var(--on-charcoal);border-color:var(--charcoal);position:relative}
.slide.dark p{color:var(--on-charcoal-2)}
.slide img{display:block;width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover}
.slide .in{position:relative;padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px}

.vid{display:flex;align-items:center;gap:12px;background:rgba(255,251,240,.08);border-radius:14px;padding:10px 12px;border:0;color:inherit;cursor:pointer;text-align:left;width:100%}

.vals{display:flex;flex-direction:column}
.vals > div{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}

.vals b{font-family:var(--font-head);font-weight:500;font-size:19px}

.commit > div:first-child{border-top:0;padding-top:0}
.ours{background:var(--charcoal);color:var(--on-charcoal);border-radius:14px;padding:12px 14px;font-size:14px}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px}

.gbtn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}

function vHome(){
  const n = doneCount(), C = 2*Math.PI*30, nxt = nextStep();
  const waiting = STEPS.filter(s=>S.steps[s.id]==='wait').length;
  const msg = n===STEPS.length ? 'All done.' : nxt ? `Next up: ${nxt.t}.` : 'Nearly there. We’re waiting on a couple of things.';
  return `<div class="phone">
    <section class="hero">${badge('ghost')}
      <div class="prog">
        <svg class="ring" viewBox="0 0 76 76" role="img" aria-label="${n} of ${STEPS.length} steps done">
          <circle class="track" cx="38" cy="38" r="30"/>
          <circle class="val" cx="38" cy="38" r="30" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/STEPS.length)}" transform="rotate(-90 38 38)"/>
          <text x="38" y="44" text-anchor="middle">${n}/${STEPS.length}</text>
        </svg>
        <div class="stack" style="gap:6px">
          <h1 style="font-size:26px">Hi Sarah</h1>
          <p>${msg}${waiting? ' We’ll let you know when the others are through.':''}</p>
        </div>
      </div>
    </section>
    <ul class="steps">
      ${STEPS.map(s=>{
        const st=S.steps[s.id], isNext = nxt && nxt.id===s.id;
        const ico = st==='done' ? `<span class="ico done">${tick}</span>` : st==='wait' ? `<span class="ico wait">${clock}</span>` : `<span class="ico ${isNext?'next':'todo'}"></span>`;
        let meta = s.m;
        if(st==='done' && s.id==='training') meta='Completed · certificate saved';
        if(st==='done' && s.id==='induct') meta='Done · you said “I’m in”';
        if(st==='done' && s.id==='conduct') meta=`Signed ${S.signedOn||'today'} · version 2026.1`;
        if(st==='done' && s.id==='referees') meta='Both referees have replied';
        if(st==='done' && s.id==='bluecard') meta=`Verified · expires ${fmtDate(S.blue.exp)}`;
        if(st==='done' && s.id==='details') meta='Sarah Mitchell · 0412 345 678';
        if(st==='wait' && s.id==='referees') meta = S.flagged && S.refs.every(r=>r.st===3) ? 'Both replied · the office will be in touch' : `${S.refs.filter(r=>r.st===3).length} of 2 replied · we’ll chase them for you`;
        if(st==='wait' && s.id==='bluecard') meta='Sent to the office to check in the Blue Card portal';
        return `<li><button class="step ${isNext?'is-next':''}" data-step="${s.id}">${ico}<span class="body"><span class="t">${s.t}</span><span class="m">${meta}</span></span>${chev}</button></li>`;
      }).join('')}
    </ul>
    ${S.steps.bluecard==='wait' ? `<p class="small muted" style="text-align:center">Prototype shortcut: <button class="link" data-act="verify-self">pretend the office verified it</button></p>`:''}
    <p class="small muted" style="text-align:center">Stuck? Reply to your welcome email and the office will help.</p>
  </div>`;
}

function vTraining(){
  const ch = S.chapter;
  if(ch >= CHAPTERS.length) return vQuiz();
  const [title,dur] = CHAPTERS[ch];
  return `<div class="phone">
    <button class="back" data-go="home">← Your steps</button>
    <div class="stack" style="gap:4px"><span class="label">Safe Spaces training</span><h2 style="font-size:26px">Chapter ${ch+1}: ${title}</h2></div>
    <div class="video">${badge('ghost')}

function vQuiz(){
  const Q = QUIZ[S.q], p = S.picked;
  return `<div class="phone">
    <button class="back" data-go="home">← Your steps</button>
    <div class="dots" aria-hidden="true">${QUIZ.map((_,i)=>`<span class="${i<=S.q?'on':''}"></span>`).join('')}</div>
    <span class="label">Question ${S.q+1} of ${QUIZ.length}</span>
    <h2 style="font-size:24px">${Q.q}</h2>
    <div class="qopts">${Q.o.map((o,i)=>{
      let c=''; if(p!==null){ if(i===p) c = i===Q.a?'right':'wrong'; }
      return `<button class="qopt ${c}" data-pick="${i}">${o}</button>`; }).join('')}</div>
    ${p===null?'':p===Q.a?`<div class="fb ok"><b>That’s right.</b> ${Q.why}</div>`:`<div class="fb no"><b>Not quite. Have another go.</b></div>`}
    <button class="btn block" data-act="qnext" ${p===Q.a?'':'disabled'}>${S.q===QUIZ.length-1?'Finish training':'Next question'} <span class="arr">→</span></button>
  </div>`;
}

        <div class="in"><span class="label">Our story</span><h3>Where we’ve come from</h3>
          <p>Lifepoint began in 2007 as a small group of people with a big hope: that people in our city who were far from God would come to know Jesus.</p>
          <p class="muted">Today we’re a multigenerational church family across the City of Moreton Bay, part of Queensland Baptists. One church in multiple locations, sharing one vision, one set of values and one culture.</p>

        <div class="in"><span class="label">Our values</span>
          <div class="vals">
            <div><b>Inviting Family</b><em>Open · Vibrant · Authentic</em><span class="tip"><b>On a team</b>Notice the person on their own, learn names, and make sure a newcomer never feels like an outsider.</span></div>
            <div><b>House of Prayer</b><em>Dependent · Thankful · Prayerful</em><span class="tip"><b>On a team</b>Pray for the people you serve, pray with your team before you start, and trust God with the results.</span></div>
            <div><b>Light to the World</b><em>Generous · Investors · Inviters</em><span class="tip"><b>On a team</b>Remember that what you do on a team matters to someone you have never met.</span></div>
          </div></div></section>
      <section class="slide" aria-label="4 of 5"><div class="in"><span class="label">Our culture</span><h3>How we do things here</h3>
          <ul class="culture">
            <li><b>We prioritise reaching people over keeping people</b>Every Sunday is someone’s first.</li>
            <li><b>We all lead</b>You don’t need a title to lead.</li>
            <li><b>We serve from security</b>Our value comes from being children of God.</li>
            <li><b>We serve with joy</b>Joy is contagious.</li>
            <li><b>We honour each other</b>When someone wins, we all win.</li>
            <li><b>We bring our best</b>Excellence honours God. It doesn’t mean perfection.</li>
            <li><b>We stay healthy</b>Taking a break is better than burning out.</li>
            <li><b>We give people a go</b>We make room for new people to try, learn and grow.</li>
          </ul></div></section>
      <section class="slide" aria-label="5 of 5"><div class="in"><span class="label">Your commitments</span><h3>What we ask of each other</h3>
          <div class="commit">
            <div><h4>Your walk with God</h4><ul><li>Keep growing with Jesus through Scripture and prayer</li><li>If you’re struggling, talk to us early</li></ul></div>
            <div><h4>Your part in the church</h4><ul><li>Attend Sundays regularly</li><li>Belong to a small group</li><li>Give financially</li><li>Invite others</li></ul></div>
            <div><h4>Your responsibility to your team</h4><ul><li>Respond to your roster promptly in ChurchSuite</li><li>Arrive on time for the team briefing</li><li>Keep confidences, unless someone is at risk</li></ul></div>
          </div>
          <div class="ours"><span class="label">Our commitment to you</span><p style="margin-top:4px">We will pray for you, honour your time, train and support you, and respect the boundaries you set around your family, work and health.</p></div>
        </div></section>
    </div>

      <button class="btn ghost" data-act="sprev" ${i===0?'disabled':''} aria-label="Previous">←</button>
      <div class="pdots" aria-hidden="true">${Array.from({length:N},(_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
      <button class="btn" id="snext" data-act="snext">Next <span class="arr">→</span></button>
    </div>
    <p class="small muted" style="text-align:center">Want the whole thing? <button class="link" data-act="handbook">Read the Team Lifepoint Handbook</button></p>
  </div>`;
}
function updatePager(){
  const i=S.slide||0, N=5;
  document.querySelectorAll('.pdots span').forEach((d,k)=>d.classList.toggle('on',k===i));
  const prev=$('[data-act=sprev]'); if(prev) prev.disabled = i===0;
  const nx=$('#snext'); if(nx){ nx.dataset.act = i===N-1?'imin':'snext'; nx.innerHTML = i===N-1?'I’m in':'Next <span class="arr">→</span>'; }
}
function setupDeck(){
  const d=$('#deck'); if(!d) return;
  d.scrollLeft = (S.slide||0)*(d.clientWidth+12);
  let t; d.addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(()=>{ S.slide=Math.round(d.scrollLeft/(d.clientWidth+12)); updatePager(); },100); });
  updatePager();
}
function goSlide(k){ S.slide=Math.max(0,Math.min(4,k)); const d=$('#deck'); if(d) d.scrollTo({left:S.slide*(d.clientWidth+12),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); updatePager(); }

function vSignin(){

  return `<div class="phone">

function vConduct(){

function vReferees(){
  const sent = S.steps.referees!=='todo';
  const track = r => {
    const labels=['Email sent','Opened','Replied'];
    return `<div class="track">${labels.map((l,i)=>`${i?'<i></i>':''}<span class="${r.st>i?'on':''}">${r.st>i?tick:''}${l}</span>`).join('')}</div>`;
  };
  return `<div class="phone">
    <button class="back" data-go="home">← Your steps</button>
    <div class="stack" style="gap:6px"><span class="label">Referees</span><h2 style="font-size:26px">Two people who know you well</h2>
    <p class="muted">They need to have known you for at least two years and can’t be family. We’ll email them a 2-minute form and chase them for you.</p></div>
    ${S.refs.map((r,i)=>`<section class="card ref">
      <h3>Referee ${i+1} ${sent && r.st===3?'<span class="pill ok">Done</span>':''}</h3>
      ${sent ? `<div><b>${esc(r.name)}</b><div class="small muted">${esc(r.rel)} · known ${esc(r.yrs)}</div></div>${track(r)}` : `
      <div class="field"><label for="rn${i}">Name</label><input id="rn${i}" value="${esc(r.name)}"></div>
      <div class="field"><label for="re${i}">Email</label><input id="re${i}" type="email" value="${esc(r.email)}"></div>
      <div class="row2">
        <div class="field"><label for="rr${i}">How you know them</label><select id="rr${i}">${['Former team leader','Work colleague','Friend','Community or sport','Other'].map(o=>`<option ${o===r.rel?'selected':''}>${o}</option>`).join('')}</select></div>
        <div class="field"><label for="ry${i}">For how long</label><select id="ry${i}">${['2–5 years','5+ years'].map(o=>`<option ${o===r.yrs?'selected':''}>${o}</option>`).join('')}</select></div>
      </div>`}
    </section>`).join('')}
    ${sent ? `<p class="small muted" style="text-align:center">Want to see what Mark receives? Open the <button class="link" data-mode-go="referee">Referee view</button>.</p>
              <button class="btn ghost block" data-go="home">Back to your steps</button>`
           : `<button class="btn block" data-act="sendrefs">Send referee requests <span class="arr">→</span></button>`}

}

function certData(){
  const today = new Date('2026-11-14T00:00:00');
  const refresher = new Date(today); refresher.setFullYear(today.getFullYear()+1);
  const bc = new Date(S.blue.exp+'T00:00:00');
  const valid = bc < refresher ? bc : refresher;
  const f = d => d.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  return {name:'Sarah Mitchell', team:'Welcome team', no:'LP-2026-0347', issued:f(today), short:today.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}), valid:f(valid), bcExp:f(bc)};
}

function confetti(){
  const box = $('#conf'); if(!box || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#B1B89F','#BFCFD7','#FFFBF0','#71806D','#3D6270'];
  for(let i=0;i<40;i++){ const c=document.createElement('i'); c.style.left=Math.random()*100+'%'; c.style.background=cols[i%cols.length]; c.style.animationDelay=(Math.random()*.6)+'s'; box.appendChild(c); }
}

function setupPad(){
  const cv = $('#sigpad'); if(!cv) return;
  const dpr = window.devicePixelRatio||1, r = cv.getBoundingClientRect();
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.lineWidth=2.4; g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle = getComputedStyle(document.body).color;
  let draw=false, has=false, lx=0, ly=0;
  const pos = e => { const b=cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  cv.onpointerdown = e => { draw=true; [lx,ly]=pos(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if(!draw) return; const [x,y]=pos(e); g.beginPath(); g.moveTo(lx,ly); g.lineTo(x,y); g.stroke(); lx=x; ly=y;
    if(!has){ has=true; $('#sighint').hidden=true; check(); } };
  cv.onpointerup = cv.onpointercancel = () => draw=false;
  const check = () => { $('#signbtn').disabled = !(has && $('#cagree').checked && $('#cname').value.trim()); };
  $('#cagree').onchange = check; $('#cname').oninput = check;
  cv._clear = () => { g.clearRect(0,0,cv.width,cv.height); has=false; $('#sighint').hidden=false; check(); };
}

function renderVolunteer(){
  if(S.screen==='home' && doneCount()===STEPS.length && !S.celebrated){ S.celebrated=true; S.screen='cleared'; }
  const map = {welcome:vWelcome, signin:vSignin, home:vHome, induct:vInduct, training:vTraining, conduct:vConduct, referees:vReferees, bluecard:vBlue, cleared:vCleared};
  view.innerHTML = map[S.screen]();
  if(S.screen==='conduct') setupPad();
  if(S.screen==='induct') setupDeck();
  if(S.screen==='cleared') confetti();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-act], tr[data-person]'); if(!t) return;
  if(t.dataset.mode){ setMode(t.dataset.mode); return; }
  if(t.dataset.modeGo){ setMode(t.dataset.modeGo); return; }
  if(t.dataset.go){ S.screen=t.dataset.go; S.playing=false; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.step){ const id=t.dataset.step;
    if(id==='details'){ toast('Your details are already saved.'); return; }
    if(id==='training' && S.steps.training==='done'){ toast('Training complete. Your certificate is in your email.'); return; }
    if(id==='conduct' && S.steps.conduct==='done'){ toast('Already signed. A copy is in your email.'); return; }
    S.screen=id; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.pick!==undefined){ S.picked=+t.dataset.pick; render(); return; }
  if(t.dataset.role){ A.role=t.dataset.role; A.open=null; A.filter='all'; A.ministry='All teams'; layer.innerHTML=''; renderAdmin(); return; }
  if(t.dataset.filter){ A.filter = (A.filter===t.dataset.filter && t.dataset.filter!=='all')?'all':t.dataset.filter; renderAdmin(); return; }
  if(t.dataset.person){ A.open=t.dataset.person; renderDrawer(); return; }
  if(t.dataset.ract==='open'){ R.screen='form'; R.bad=false; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.ract==='reset'){ R.screen='email'; render(); return; }
  const a = t.dataset.act;
  if(a==='play'){ S.playing=true; render(); }
  if(a==='chapter'){ S.chapter++; S.playing=false; render(); window.scrollTo({top:0}); }
  if(a==='qnext'){ if(S.q<QUIZ.length-1){ S.q++; S.picked=null; render(); } else { S.steps.training='done'; S.screen='home'; toast('Training complete. Certificate saved.'); render(); window.scrollTo({top:0}); } }
  if(a==='clearsig'){ $('#sigpad')._clear(); }
  if(a==='sign'){ S.steps.conduct='done'; S.signedOn=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short'}); S.screen='home'; toast('Signed. A copy is on its way to your email.'); render(); window.scrollTo({top:0}); }
  if(a==='sendrefs'){
    S.refs.forEach((r,i)=>{ r.name=$('#rn'+i).value||r.name; r.email=$('#re'+i).value||r.email; r.rel=$('#rr'+i).value; r.yrs=$('#ry'+i).value; r.st=1; });
    S.steps.referees='wait'; toast('Emails sent to both referees.'); render();
    setTimeout(()=>{ S.refs.forEach(r=>{ if(r.st<2) r.st=2; }); if(mode==='volunteer') render(); }, 1800);
    setTimeout(()=>{ S.refs[1].st=3; refsCheck(); }, 4200);
    setTimeout(()=>{ if(S.refs[0].st<3){ S.refs[0].st=3; refsCheck(); } }, 9000);
  }
  if(a==='sendblue'){ S.blue.num=$('#bnum').value||S.blue.num; S.blue.exp=$('#bexp').value||S.blue.exp; S.steps.bluecard='wait'; S.screen='home'; toast('Sent to the office for checking.'); render(); }
  if(a==='verify-self'){ S.steps.bluecard='done'; toast('The office verified your Blue Card.'); render(); }
  if(a==='verify'){ if(t.dataset.who==='Sarah Mitchell'){ S.steps.bluecard='done'; } else { const p=PEOPLE.find(x=>x.n===t.dataset.who); if(p) p.bc='ok'; }
    toast(`Blue Card verified for ${t.dataset.who}. Logged under your name.`); A.open=null; renderAdmin(); }
  if(a==='remind'){ toast(`Reminder sent to ${t.dataset.who}.`); }
  if(a==='addrole'){ toast('This would let you pick a person and a role.'); }
  if(a==='cs'){ toast('This would open their ChurchSuite profile.'); }
  if(a==='note'){ toast('This would open a private note only you can see.'); }
  if(a==='close'){ A.open=null; layer.innerHTML=''; }
  if(a==='vsend'){ S.si='code'; render(); }
  if(a==='vresend'){ toast('A new code is on its way.'); }
  if(a==='vcode'){ S.si=null; S.screen='home'; toast('Signed in. Welcome back, Sarah.'); render(); window.scrollTo({top:0}); }
  if(a==='google'){ A.si='code'; renderAdmin(); }
  if(a==='scode'){ A.si='google'; A.signedIn=true; renderAdmin(); window.scrollTo({top:0}); }
  if(a==='signout'){ A.signedIn=false; A.open=null; layer.innerHTML=''; renderAdmin(); window.scrollTo({top:0}); }
  if(a==='roles'){ openRoles(); }
  if(a==='snext'){ goSlide((S.slide||0)+1); }
  if(a==='sprev'){ goSlide((S.slide||0)-1); }
  if(a==='imin'){ S.steps.induct='done'; S.slide=0; S.screen='home'; toast('Welcome to Team Lifepoint.'); render(); window.scrollTo({top:0}); }
  if(a==='vid'){ toast('Your welcome video plays here.'); }
  if(a==='handbook'){ toast('This would open the Team Lifepoint Handbook PDF.'); }
  if(a==='cert'){ openCert(); }
  if(a==='close-cert'){ layer.innerHTML=''; }
  if(a==='cert-pdf'){ toast('In the real app this saves a PDF to your phone. The prototype can’t download files.'); }
  if(a==='restart'){ S=fresh(); render(); window.scrollTo({top:0}); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && (A.open || $('.cert-overlay'))){ A.open=null; layer.innerHTML=''; }
  if(e.key==='Enter' && e.target.matches('tr[data-person]')){ A.open=e.target.dataset.person; renderDrawer(); }
});
document.addEventListener('change', e => {
  if(e.target.id==='cagree' || e.target.id==='cname') return;
});

const h = (location.hash||'').slice(1);
if(['volunteer','referee','admin'].includes(h)) mode=h;
render();
window.addEventListener('hashchange', ()=>{ const m=location.hash.slice(1); if(['volunteer','referee','admin'].includes(m) && m!==mode){ mode=m; render(); } });
})();
</script>
